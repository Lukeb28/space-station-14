# Base enemy Eye for Admin uses.
- type: entity
  parent: [ Incorporeal, BaseMob ]
  id: EnemyConsoleEye
  name: "???"
  description: "ERROR"
  categories: [ HideSpawnMenu ]
  suffix: DO NOT MAP
  components:
  - type: NoFTL
  - type: WarpPoint
    follow: true
  - type: Eye
    pvsScale: 1.5
  - type: StationAiOverlay
    allowCrossGrid: true
  - type: Visibility
    layer: 32768
  - type: Sprite
    sprite: _Starlight/Mobs/Net/net_eye.rsi
    layers:
    - map: ["base"]
      state: enemy
      shader: unshaded
  - type: Tag
    tags:
    - CantInteract
  - type: Damageable
    damageContainer: Cyber
    damageModifierSet: DefaultCybernetic
  - type: Destructible
    thresholds: 
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviours:
      - !type:RemoteEyeShockActor
      - !type:RemoteEyeThrowControl

- type: entity
  parent: EnemyConsoleEye
  id: AbductorHumanObservationConsoleEye
  categories: [ HideSpawnMenu ]
  suffix: DO NOT MAP
  components:
  - type: SpriteWhitelisted
    localEntityWhitelist:
      tags:
        - Abductor
        - Ghost
    passedLayers:
      base:
        state: abductor
    failedLayers:
      base:
        state: enemy