- type: entity
  parent: BaseStructureComputer
  id: Masterchair
  name: observation masterchair
  description: If you think you are safe from prying eyes, you would be dead wrong— Big Brother from 1984 trembles whenever John Nanotrasen sits in this, watching every move, fining you for each inconsistency, and noting down collective failures.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Rotatable
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - TableMask
  - type: Animateable
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: Sprite
    sprite: _Starlight/Structures/Machines/masterchair.rsi
    layers:
    - state: base
    noRot: true
  - type: Strap
    position: Stand
    buckleOffset: "0,-0.05"
  - type: RemoteEyeConsole
    remoteEntityProto: CentcommConsoleEye
    color: "#00FF00"
    actions:
    - SyntrunnerActionExitConsole
  - type: UserInterface
    interfaces:
     enum.RemoteEyeUIKey.Key:
        type: RemoteEyeConsoleBui
  - type: ActivateUiOnStrapped
    key: enum.RemoteEyeUIKey.Key
  - type: ChildEntities
    childPrototypes:
      - prototype: MasterchairOverlay
        
- type: entity
  id: MasterchairOverlay
  name: observation masterchair
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Starlight/Structures/Machines/masterchair.rsi
    layers:
    - state: overlay
    noRot: true
  - type: Tag
    tags:
      - HideContextMenu

- type: entity
  parent: Masterchair
  id: MasterchairDebug
  suffix: DO NOT MAP, DEBUG
  components:
  - type: RemoteEyeConsole
    actions:
    - SyntrunnerActionExitConsole
    - ActionCyberspaceAttack